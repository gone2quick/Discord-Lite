<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LiteCord</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #313338; color: #dbdee1; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Login Screen */
  #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; background: #1e1f22; }
  #login-screen h2 { color: #fff; margin-bottom: 8px; }
  #login-screen p { color: #949ba4; font-size: 13px; margin-bottom: 16px; text-align: center; }
  #token-input { width: 100%; max-width: 340px; padding: 12px; border-radius: 6px; border: 1px solid #111214; background: #313338; color: #fff; margin-bottom: 12px; font-size: 14px; }
  .btn { background: #5865f2; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; max-width: 340px; }
  .btn:active { background: #4752c4; }

  /* Main App Layout */
  #app { display: none; height: 100%; flex-direction: column; }
  #topbar { height: 48px; background: #2b2d31; border-bottom: 1px solid #1f2023; display: flex; align-items: center; padding: 0 12px; justify-content: space-between; flex-shrink: 0; }
  #menu-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 8px; }
  #channel-title { font-weight: 700; color: #fff; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #f23f43; display: inline-block; margin-right: 6px; }
  #logout-btn { background: #da373c; border: none; color: #fff; font-size: 11px; padding: 5px 8px; border-radius: 4px; }

  #workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
  
  /* Drawer (Servers + Channels) */
  #drawer { position: absolute; top: 0; left: 0; bottom: 0; width: 82%; max-width: 320px; background: #2b2d31; display: flex; z-index: 20; transform: translateX(0); transition: transform 0.15s ease-out; border-right: 1px solid #1f2023; }
  #drawer.closed { transform: translateX(-100%); }
  #guild-list { width: 64px; background: #1e1f22; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 8px; flex-shrink: 0; }
  .guild-icon { width: 46px; height: 46px; border-radius: 50%; background: #313338; color: #dbdee1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; cursor: pointer; overflow: hidden; flex-shrink: 0; }
  .guild-icon.active { border-radius: 14px; background: #5865f2; color: #fff; }
  .guild-icon img { width: 100%; height: 100%; object-fit: cover; }

  #channel-list { flex: 1; overflow-y: auto; padding: 8px; }
  .channel-header { font-size: 11px; font-weight: 700; color: #949ba4; text-transform: uppercase; margin: 10px 4px 4px; }
  .channel-item { padding: 8px 10px; border-radius: 4px; color: #949ba4; font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-item:hover, .channel-item.active { background: #3f4248; color: #fff; }

  /* Chat Area */
  #chat-container { flex: 1; display: flex; flex-direction: column; width: 100%; background: #313338; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; flex-direction: column; word-wrap: break-word; }
  .msg-header { display: flex; align-items: baseline; gap: 6px; }
  .msg-author { font-weight: 600; color: #fff; font-size: 14px; }
  .msg-time { font-size: 11px; color: #949ba4; }
  .msg-content { font-size: 14px; color: #dbdee1; line-height: 1.35; margin-top: 2px; white-space: pre-wrap; }
  .msg-attachment { color: #00a8fc; font-size: 12px; margin-top: 3px; text-decoration: underline; }

  /* Input Bar */
  #input-bar { display: flex; padding: 8px; background: #2b2d31; gap: 8px; flex-shrink: 0; }
  #msg-input { flex: 1; background: #383a40; border: none; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 14px; outline: none; }
  #send-btn { background: #5865f2; border: none; color: #fff; border-radius: 8px; padding: 0 16px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>LiteCord</h2>
  <p>Zero-bloat native-speed Discord client. Enter your user token to connect directly to Discord's API.</p>
  <input type="password" id="token-input" placeholder="Paste Discord Token">
  <button class="btn" onclick="saveToken()">Connect</button>
</div>

<div id="app">
  <div id="topbar">
    <button id="menu-btn" onclick="toggleDrawer()">☰</button>
    <div id="channel-title"><span id="status-dot"></span><span id="active-name">Select Channel</span></div>
    <button id="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div id="workspace">
    <div id="drawer">
      <div id="guild-list"></div>
      <div id="channel-list"></div>
    </div>

    <div id="chat-container" onclick="closeDrawerOnMobile()">
      <div id="messages"></div>
      <form id="input-bar" onsubmit="sendMessage(event)">
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </div>
</div>

<script>
  let TOKEN = localStorage.getItem('discord_token') || '';
  let CURRENT_USER = null;
  let ACTIVE_CHANNEL_ID = null;
  let ws = null;
  let heartbeatTimer = null;
  let seq = null;
  let channelCache = {};

  if (TOKEN) {
    initApp();
  }

  function saveToken() {
    const val = document.getElementById('token-input').value.trim().replace(/^"|"$/g, '');
    if (!val) return;
    TOKEN = val;
    localStorage.setItem('discord_token', TOKEN);
    initApp();
  }

  function logout() {
    localStorage.removeItem('discord_token');
    if (ws) ws.close();
    location.reload();
  }

  function toggleDrawer() {
    document.getElementById('drawer').classList.toggle('closed');
  }

  function closeDrawerOnMobile() {
    if (ACTIVE_CHANNEL_ID) {
      document.getElementById('drawer').classList.add('closed');
    }
  }

  // Native Android HTTP bridge to bypass WebView CORS restrictions
  function discordApi(method, endpoint, bodyObj = null) {
    return new Promise((resolve, reject) => {
      try {
        const bodyStr = bodyObj ? JSON.stringify(bodyObj) : "";
        const rawRes = AndroidBridge.apiRequest(method, "https://discord.com/api/v10" + endpoint, TOKEN, bodyStr);
        const parsed = JSON.parse(rawRes);
        if (parsed.error) reject(parsed.error);
        else resolve(parsed);
      } catch (e) {
        reject(e);
      }
    });
  }

  async function initApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    try {
      CURRENT_USER = await discordApi('GET', '/users/@me');
      connectGateway();
      await loadGuildsAndDMs();
    } catch (e) {
      alert("Login failed. Check your token.");
      logout();
    }
  }

  async function loadGuildsAndDMs() {
    const guildList = document.getElementById('guild-list');
    guildList.innerHTML = '';

    // DM Button
    const dmBtn = document.createElement('div');
    dmBtn.className = 'guild-icon active';
    dmBtn.innerText = 'DM';
    dmBtn.onclick = () => {
      setActiveGuildIcon(dmBtn);
      loadDMs();
    };
    guildList.appendChild(dmBtn);

    // Load DMs by default
    loadDMs();

    // Load Servers
    const guilds = await discordApi('GET', '/users/@me/guilds');
    guilds.forEach(g => {
      const el = document.createElement('div');
      el.className = 'guild-icon';
      el.title = g.name;
      if (g.icon) {
        el.innerHTML = `<img src="https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64" loading="lazy">`;
      } else {
        el.innerText = g.name.substring(0, 3);
      }
      el.onclick = () => {
        setActiveGuildIcon(el);
        loadGuildChannels(g.id, g.name);
      };
      guildList.appendChild(el);
    });
  }

  function setActiveGuildIcon(activeEl) {
    document.querySelectorAll('.guild-icon').forEach(el => el.classList.remove('active'));
    activeEl.classList.add('active');
  }

  async function loadDMs() {
    const list = document.getElementById('channel-list');
    list.innerHTML = '<div class="channel-header">Direct Messages</div>';
    const dms = await discordApi('GET', '/users/@me/channels');
    dms.sort((a, b) => (b.last_message_id || 0) - (a.last_message_id || 0));

    dms.forEach(ch => {
      const name = ch.name || (ch.recipients && ch.recipients.map(r => r.username).join(', ')) || 'DM';
      channelCache[ch.id] = name;
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.innerText = '@ ' + name;
      item.onclick = () => openChannel(ch.id, '@ ' + name, item);
      list.appendChild(item);
    });
  }

  async function loadGuildChannels(guildId, guildName) {
    const list = document.getElementById('channel-list');
    list.innerHTML = `<div class="channel-header">${guildName}</div>`;
    const channels = await discordApi('GET', `/guilds/${guildId}/channels`);
    
    // Type 0 = Text channel, Type 5 = Announcement channel
    const textChannels = channels
      .filter(c => c.type === 0 || c.type === 5)
      .sort((a, b) => a.position - b.position);

    textChannels.forEach(ch => {
      channelCache[ch.id] = `#${ch.name} (${guildName})`;
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.innerText = '# ' + ch.name;
      item.onclick = () => openChannel(ch.id, '# ' + ch.name, item);
      list.appendChild(item);
    });
  }

  async function openChannel(channelId, displayName, itemEl) {
    ACTIVE_CHANNEL_ID = channelId;
    document.getElementById('active-name').innerText = displayName;
    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
    if (itemEl) itemEl.classList.add('active');
    document.getElementById('drawer').classList.add('closed');

    const msgContainer = document.getElementById('messages');
    msgContainer.innerHTML = '<div style="color:#949ba4;font-size:13px;">Loading messages...</div>';

    const messages = await discordApi('GET', `/channels/${channelId}/messages?limit=35`);
    msgContainer.innerHTML = '';
    messages.reverse().forEach(m => appendMessage(m));
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }

  function appendMessage(m) {
    const msgContainer = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg';
    const time = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const author = m.author ? (m.author.global_name || m.author.username) : 'Unknown';
    
    let attachHtml = '';
    if (m.attachments && m.attachments.length > 0) {
      attachHtml = m.attachments.map(a => `<div class="msg-attachment">[Attachment: ${a.filename}]</div>`).join('');
    }

    div.innerHTML = `
      <div class="msg-header">
        <span class="msg-author">${escapeHtml(author)}</span>
        <span class="msg-time">${time}</span>
      </div>
      <div class="msg-content">${escapeHtml(m.content || '')}</div>
      ${attachHtml}
    `;
    msgContainer.appendChild(div);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }

  async function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !ACTIVE_CHANNEL_ID) return;
    input.value = '';

    try {
      await discordApi('POST', `/channels/${ACTIVE_CHANNEL_ID}/messages`, { content: text });
    } catch (err) {
      alert("Failed to send message.");
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  // Real-time Gateway WebSocket for instant messages & notifications
  function connectGateway() {
    ws = new WebSocket("wss://gateway.discord.gg/?v=10&encoding=json");

    ws.onopen = () => {
      document.getElementById('status-dot').style.background = '#23a55a';
    };

    ws.onmessage = (event) => {
      const payload = JSON.parse(event.data);
      const { op, d, s, t } = payload;
      if (s) seq = s;

      // Opcode 10: Hello -> Start Heartbeat & Send Identify
      if (op === 10) {
        const interval = d.heartbeat_interval;
        clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ op: 1, d: seq }));
          }
        }, interval);

        ws.send(JSON.stringify({
          op: 2,
          d: {
            token: TOKEN,
            properties: { os: "Android", browser: "Chrome", device: "Mobile" }
          }
        }));
      }

      // Opcode 0: Dispatch Event
      if (op === 0 && t === "MESSAGE_CREATE") {
        // Append to chat if currently viewing this channel
        if (d.channel_id === ACTIVE_CHANNEL_ID) {
          appendMessage(d);
        }

        // Trigger Android notification if message is from someone else
        if (CURRENT_USER && d.author && d.author.id !== CURRENT_USER.id) {
          const isDM = !d.guild_id;
          const isMention = d.mentions && d.mentions.some(u => u.id === CURRENT_USER.id);
          if (isDM || isMention || d.channel_id !== ACTIVE_CHANNEL_ID) {
            const sender = d.author.global_name || d.author.username;
            const loc = channelCache[d.channel_id] || (isDM ? "Direct Message" : "Server");
            try {
              AndroidBridge.sendNotification(`${sender} (${loc})`, d.content || "[Attachment]");
            } catch (e) {}
          }
        }
      }
    };

    ws.onclose = () => {
      document.getElementById('status-dot').style.background = '#f23f43';
      clearInterval(heartbeatTimer);
      setTimeout(connectGateway, 3000);
    };
  }
</script>
</body>
</html>
